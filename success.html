<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser Title -->
    <title>Message Sent | Intra Creative Studios</title>

    <!-- Main Styles -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Animation Styles -->
    <link rel="stylesheet" href="css/animations.css" />

    <!-- Responsive Styles -->
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body>
    <!-- ==================================
     WEBSITE LOADER
================================== -->

    <div id="loader">
      <div class="loader-content">
        <img
          src="assets/images/logo.jpg"
          alt="Intra Creative Studios Logo"
          class="loader-logo"
        />

        <div class="loader-spinner"></div>

        <p class="loader-loading-text">Loading...</p>
      </div>
    </div>

    <!-- =========================
        HEADER
========================= -->

    <header>
      <nav>
        <div class="container">
          <div class="logo">
            <a href="index.html">
              <img
                src="assets/images/logo.jpg"
                alt="Intra Creative Studios Logo"
                class="site-logo"
              />
            </a>
          </div>
        </div>
      </nav>
    </header>

    <!-- ===============================
         SUCCESS PAGE
    ================================ -->

    <section class="success-page">
      <div class="success-card">
        <div class="success-icon">✓</div>

        <h1>Message Sent Successfully</h1>

        <p>
          Thank you for contacting
          <strong>Intra Creative Studios.</strong>

          <br /><br />

          Your message has been received successfully. We appreciate your
          interest in our services and will respond to you as soon as possible.
        </p>

        <a href="index.html" class="success-button"> Return to Homepage </a>
      </div>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
